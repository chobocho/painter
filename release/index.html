<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Chobocho's Painter</title>
    <style>
/* Fold7 unfolded layout: 화면 높이에 꽉 채우고 스크롤 없음. 3열 2행. */
:root {
  --bg: #1e1e22;
  --panel: #2a2a30;
  --panel2: #34343c;
  --fg: #e8e8ee;
  --accent: #6aaaff;
  --border: #44444c;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  width: 100%;
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 13px;
  overflow: hidden;
}

#app {
  /* 모바일 브라우저는 주소창이 접히면서 100vh 가 실제 보이는 높이보다 커진다.
     dvh 를 쓰되, 지원하지 않는 브라우저를 위해 vh 를 먼저 둔다. */
  height: 100vh;
  height: 100dvh;
  width: 100vw;
}

#painter-root {
  display: grid;
  width: 100%;
  height: 100%;
  grid-template-rows: 44px 1fr 24px;
  grid-template-columns: 144px 1fr 320px;
  grid-template-areas:
    "menu menu menu"
    "tool canvas right"
    "status status status";
  overflow: hidden;
  position: relative;
}

#menu-bar {
  grid-area: menu;
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  padding: 0 12px 0 12px;
  /* `overflow-x: auto` so the brush controls can scroll instead of clipping
     the prominent panel-toggle button at the right edge of the menu. */
  overflow-x: auto;
  overflow-y: hidden;
}
#menu-bar::-webkit-scrollbar { height: 4px; }
#menu-bar::-webkit-scrollbar-thumb { background: var(--border); }

#palette-area {
  display: flex;
  flex-wrap: nowrap;
  gap: 4px;
  align-items: center;
  flex-shrink: 0;
}

.swatch {
  width: 24px;
  height: 24px;
  border: 1px solid var(--border);
  border-radius: 3px;
  cursor: pointer;
  padding: 0;
}

.color-picker {
  width: 30px;
  height: 30px;
  border: 1px solid var(--border);
  background: transparent;
  cursor: pointer;
}

#brush-controls {
  display: flex;
  gap: 12px;
  align-items: center;
}

#brush-controls label {
  display: flex;
  gap: 6px;
  align-items: center;
  white-space: nowrap;
}

#toggle-panel-btn {
  background: var(--accent);
  color: #1a1a1f;
  border: 1px solid var(--accent);
  border-radius: 4px;
  padding: 6px 12px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  flex-shrink: 0;
  white-space: nowrap;
}
#toggle-panel-btn:hover { filter: brightness(1.1); }

#undo-redo-group {
  display: flex;
  gap: 4px;
  flex-shrink: 0;
}
#undo-redo-group button {
  background: var(--panel2);
  color: var(--fg);
  border: 1px solid var(--border);
  border-radius: 4px;
  width: 34px;
  height: 30px;
  cursor: pointer;
  font-size: 18px;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}
#undo-redo-group button:hover:not(:disabled) {
  background: #3e3e48;
  border-color: var(--accent);
}
#undo-redo-group button:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

#floating-panel-btn {
  position: absolute;
  top: 6px;
  right: 6px;
  z-index: 100;
  background: var(--accent);
  color: #1a1a1f;
  border: 1px solid var(--accent);
  border-radius: 50%;
  width: 32px;
  height: 32px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
}
#floating-panel-btn:hover { filter: brightness(1.1); }

#tool-area {
  grid-area: tool;
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3px;
  padding: 4px;
  overflow-y: auto;
  align-content: start;
}

.tool-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 4px 1px;
  background: var(--panel2);
  color: var(--fg);
  border: 1px solid var(--border);
  border-radius: 3px;
  cursor: pointer;
  /* 7~8px 는 실기기에서 거의 읽히지 않는다. 최소 10px 로 올리고 버튼 높이를
     그만큼 키워 두 줄(아이콘+라벨)이 잘리지 않게 한다. */
  font-size: 10px;
  line-height: 1.15;
  gap: 1px;
  min-height: 42px;
}

.tool-btn .tool-icon {
  font-size: 14px;
  line-height: 1;
}
.tool-btn .tool-label {
  font-size: 10px;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}

.tool-btn:hover { background: #3e3e48; }
.tool-btn.active { background: var(--accent); color: #1a1a1f; border-color: var(--accent); }

#canvas-area {
  grid-area: canvas;
  background: #111114;
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  padding: 16px;
}

#display-canvas {
  background: #fff;
  box-shadow: 0 0 0 1px var(--border);
  touch-action: none;
  image-rendering: pixelated;
  cursor: crosshair;
}

#right-panel {
  grid-area: right;
  background: var(--panel);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#layer-panel, #history-panel, #project-panel {
  border-bottom: 1px solid var(--border);
  padding: 8px;
  overflow-y: auto;
  flex-shrink: 0;
}
#layer-panel { flex: 1.2 1 0; }
#history-panel { flex: 1 1 0; }
#project-panel { flex: 0.8 1 0; }

.panel-header {
  display: flex;
  justify-content: flex-start;
  align-items: center;
  font-weight: 600;
  margin-bottom: 6px;
  gap: 6px;
}

.panel-header .panel-title { flex: 1; }

.panel-header button {
  background: var(--panel2);
  border: 1px solid var(--border);
  color: var(--fg);
  min-width: 28px;
  height: 28px;
  border-radius: 3px;
  cursor: pointer;
  font-size: 14px;
  padding: 0 4px;
}
.panel-header button:hover:not(:disabled) {
  background: #3e3e48;
  border-color: var(--accent);
}
.panel-header button:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

.panel-collapse-btn {
  font-size: 11px !important;
  min-width: 22px !important;
  height: 22px !important;
}

.history-undo-btn, .history-redo-btn {
  font-size: 18px !important;
  font-weight: 700;
}

.layer-list, .history-list, .project-list {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.layer-row {
  display: flex;
  gap: 4px;
  align-items: center;
  background: var(--panel2);
  border: 1px solid var(--border);
  border-left: 3px solid var(--border);
  padding: 4px 4px 4px 6px;
  border-radius: 3px;
  cursor: pointer;
  user-select: none;
}
.layer-row:hover { background: #3a3a44; }
.layer-row.active {
  border-color: var(--accent);
  border-left-color: var(--accent);
  background: #3a4055;
  box-shadow: inset 0 0 0 1px var(--accent);
}
.layer-row .layer-name {
  flex: 1;
  min-width: 0;
  background: transparent;
  color: var(--fg);
  border: none;
  font-size: 12px;
  cursor: pointer;
  pointer-events: auto;
  padding: 2px 4px;
  border-radius: 2px;
}
.layer-row .layer-name:not([readonly]) {
  background: var(--bg);
  cursor: text;
  outline: 1px solid var(--accent);
}
.layer-row input[type="range"] { width: 50px; }
.layer-row button {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--fg);
  width: 22px;
  height: 22px;
  cursor: pointer;
  padding: 0;
  font-size: 11px;
}
.layer-row button:hover { background: #3e3e48; border-color: var(--accent); }

.layer-add-btn {
  background: var(--accent) !important;
  color: #1a1a1f !important;
  border: 1px solid var(--accent) !important;
  padding: 4px 10px !important;
  font-size: 11px !important;
  font-weight: 600;
  border-radius: 3px;
  cursor: pointer;
  white-space: nowrap;
  width: auto !important;
  min-width: 80px !important;
  height: 26px !important;
}
.layer-add-btn:hover:not(:disabled) { filter: brightness(1.1); }
.layer-add-btn:disabled {
  opacity: 0.4 !important;
  cursor: not-allowed;
}

.history-row {
  background: var(--panel2);
  border: 1px solid var(--border);
  padding: 3px 6px;
  border-radius: 3px;
  font-size: 11px;
}
.history-row.current {
  border-color: var(--accent);
  background: #3a4055;
}

.btn-row { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px; }
.btn-row button, .btn-row label {
  background: var(--panel2);
  border: 1px solid var(--border);
  color: var(--fg);
  padding: 4px 8px;
  border-radius: 3px;
  cursor: pointer;
  font-size: 11px;
}
.btn-row label input { display: none; }

.project-row {
  display: flex;
  align-items: center;
  gap: 4px;
  background: var(--panel2);
  border: 1px solid var(--border);
  padding: 4px 6px;
  border-radius: 3px;
  font-size: 11px;
}
.project-row:hover { border-color: var(--accent); }
/* 이름은 남는 폭을 다 쓰고, 길면 말줄임. 버튼은 오른쪽에 고정. */
.project-name {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  cursor: pointer;
}
.project-rename, .project-delete {
  flex: 0 0 auto;
  padding: 2px 6px;
  font-size: 12px;
  line-height: 1;
}

.project-empty {
  font-size: 11px;
  color: #888;
  padding: 8px 4px;
  text-align: center;
  font-style: italic;
}

#status-bar {
  grid-area: status;
  background: var(--panel);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 12px;
  font-size: 12px;
  color: #cfcfd6;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* When the user toggles the right panel off, the canvas column expands. */
#painter-root.right-hidden {
  grid-template-columns: 144px 1fr 0;
}

/* Folded narrow screens: collapse the right panel into an overlay. */
@media (max-width: 1100px) {
  #painter-root {
    grid-template-columns: 120px 1fr 0;
    grid-template-areas:
      "menu menu menu"
      "tool canvas canvas"
      "status status status";
  }
  #right-panel {
    position: fixed;
    top: 44px;
    right: 0;
    bottom: 24px;
    width: 280px;
    z-index: 5;
    box-shadow: -2px 0 8px rgba(0, 0, 0, 0.4);
  }
  #painter-root.right-hidden #right-panel { display: none !important; }
}

    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
"use strict";
(() => {
  // dist/src/util/Uid.js
  var counter = 0;
  var prefix = Math.floor(Math.random() * 1e6).toString(36);
  var Uid = {
    next() {
      counter++;
      return `${prefix}-${Date.now().toString(36)}-${counter.toString(36)}`;
    },
    reset(p) {

    }
  };

  // dist/src/core/Layer.js
  var Layer = class _Layer {
    constructor(opts) {
      Object.defineProperty(this, "id", {
        enumerable: true,
        configurable: true,
        writable: true,
        value: void 0
      });
      Object.defineProperty(this, "name", {
        enumerable: true,
        configurable: true,
        writable: true,
        value: void 0
      });
      Object.defineProperty(this, "visible", {
        enumerable: true,
        configurable: true,
        writable: true,
        value: true
      });
      Object.defineProperty(this, "opacity", {
        enumerable: true,
        configurable: true,
        writable: true,
        value: 1
      });
      Object.defineProperty(this, "blendMode", {
        enumerable: true,
        configurable: true,
        writable: true,
        value: "source-over"
      });
      Object.defineProperty(this, "locked", {
        enumerable: true,
        configurable: true,
        writable: true,
        value: false
      });
      Object.defineProperty(this, "canvas", {
        enumerable: true,
        configurable: true,
        writable: true,
        value: void 0
      });
      Object.defineProperty(this, "ctx", {
        enumerable: true,
        configurable: true,
        writable: true,
        value: void 0
      });
      Object.defineProperty(this, "revision", {
        enumerable: true,
        configurable: true,
        writable: true,
        value: 0
      });
      Object.defineProperty(this, "serializeCache", {
        enumerable: true,
        configurable: true,
        writable: true,
        value: null
      });
      this.id = opts.id ?? Uid.next();
      this.name = opts.name ?? "Layer";
      this.canvas = opts.factory(opts.width, opts.height);
      const ctx = this.canvas.getContext("2d");
      if (!ctx)
        throw new Error("Failed to acquire 2d context");
      this.ctx = ctx;
    }
    get width() {
      return this.canvas.width;
    }
    get height() {
      return this.canvas.height;
    }
    getCanvas() {
      return this.canvas;
    }
    /**
     * 그리기용 컨텍스트. 넘겨주는 순간 픽셀이 바뀔 수 있다고 보고 직렬화 캐시를
     * 버린다. 실제로 안 그렸어도 손해는 재직렬화 한 번뿐이고, 낡은 스냅샷을

    getCtx() {
      this.revision++;
      return this.ctx;
    }
    clear(x = 0, y = 0, w = this.width, h = this.height) {
      this.revision++;
      this.ctx.clearRect(x, y, w, h);
    }
    getPixels(x, y, w, h) {
      return this.ctx.getImageData(x, y, w, h);
    }
    putPixels(img, x, y) {
      this.revision++;
      let out = img;
      if (typeof ImageData !== "undefined" && !(img instanceof ImageData)) {
        out = new ImageData(img.data, img.width, img.height);
      }
      this.ctx.putImageData(out, x, y);
    }
    cloneSnapshotMeta() {
      return {
        id: this.id,
        name: this.name,
        visible: this.visible,
        opacity: this.opacity,
        blendMode: this.blendMode,
        locked: this.locked,
        width: this.width,
        height: this.height
      };
    }
    serialize(opts = {}) {
      const compact = !!opts.compact;
      const meta = this.cloneSnapshotMeta();
      const cached = this.serializeCache;
      if (cached && cached.revision === this.revision && cached.compact === compact) {
        return { ...cached.snapshot, ...meta };
      }
      const img = this.ctx.getImageData(0, 0, this.width, this.height);
      let snapshot;
      if (!compact) {
        snapshot = { ...meta, rawRGBA: encodeBase64(img.data) };
      } else if (isAllTransparent(img.data)) {
        snapshot = { ...meta };
      } else {
        const rle = rleEncodeRGBA(img.data);
        snapshot = rle.length < img.data.length ? { ...meta, rleRGBA: encodeBase64(rle) } : { ...meta, rawRGBA: encodeBase64(img.data) };

    }

        id: snap.id,
        name: snap.name,

      layer.blendMode = snap.blendMode;
      layer.locked = snap.locked;

        const compressed = decodeBase64(snap.rleRGBA);
        const data = rleDecodeRGBA(compressed, expected);

      } else if (snap.rawRGBA && snap.rawRGBA.length > 0) {

      let count = 1;
      let j = i + 4;

        count++;
        j += 4;
      }

      out[o++] = count & 255;
      out[o++] = r;
      out[o++] = g;
      out[o++] = b;
      out[o++] = a;
      i = j;
    }
    return out.subarray(0, o);
  }
  function rleDecodeRGBA(src, expectedBytes) {
    if (src.length % 6 !== 0) {
      throw new Error(`rleDecodeRGBA: \uC190\uC0C1\uB41C RLE \uAE38\uC774 ${src.length} (6\uC758 \uBC30\uC218\uAC00 \uC544\uB2D8)`);

    let o = 0;

    if (g.Buffer) {

    return out;
  }

  // dist/src/util/Rect.js
  var Rect = {
    create(x, y, w, h) {
      return { x, y, w, h };
    },
    empty() {
      return { x: 0, y: 0, w: 0, h: 0 };
    },
    isEmpty(r) {
      return r.w <= 0 || r.h <= 0;
    },
    union(a, b) {
      if (Rect.isEmpty(a))

      if (Rect.isEmpty(b))
        return { ...a };

      const y = Math.min(a.y, b.y);

      const y1 = Math.max(a.y + a.h, b.y + b.h);
      return { x, y, w: x1 - x, h: y1 - y };
    },
    intersect(a, b) {
      const x = Math.max(a.x, b.x);
      const y = Math.max(a.y, b.y);
      const x1 = Math.min(a.x + a.w, b.x + b.w);
      const y1 = Math.min(a.y + a.h, b.y + b.h);
      if (x1 <= x || y1 <= y)
        return Rect.empty();
      return { x, y, w: x1 - x, h: y1 - y };
    },
    fromPoints(x0, y0, x1, y1) {
      const x = Math.min(x0, x1);
      const y = Math.min(y0, y1);
      return { x, y, w: Math.abs(x1 - x0), h: Math.abs(y1 - y0) };
    },
    expand(r, n) {
      return { x: r.x - n, y: r.y - n, w: r.w + 2 * n, h: r.h + 2 * n };
    },
    clamp(r, bounds) {
      return Rect.intersect(r, bounds);
    },
    contains(r, x, y) {

  async function importPngFile(file, projectWidth, projectHeight, factory, name) {

  function removeBackground(src, key, tolerance, feather) {
    const out = new Uint8ClampedArray(src.data);
    const tol = tolerance;
    const tol2 = tol * tol;
    const outer = tol + Math.max(0, feather);
    const outer2 = outer * outer;
    for (let i = 0; i < out.length; i += 4) {
      const dr = out[i] - key.r;
      const dg = out[i + 1] - key.g;
      const db = out[i + 2] - key.b;
      const d2 = dr * dr + dg * dg + db * db;
      if (d2 <= tol2) {
        out[i + 3] = 0;
      } else if (d2 <= outer2 && feather > 0) {
        const d = Math.sqrt(d2);
        const t = (d - tol) / feather;
        out[i + 3] = Math.max(0, Math.min(255, Math.round(out[i + 3] * t)));
      }
    }
    return { width: src.width, height: src.height, data: out };
  }

      if (hIn === null)
        return;
      const w = parseProjectSize(wIn, this.projectWidth);
      const h = parseProjectSize(hIn, this.projectHeight);
      if (w === null || h === null) {
        this.flashStatus(`\u26A0\uFE0F \uD06C\uAE30\uB294 1~${MAX_PROJECT_SIZE} \uC0AC\uC774\uC758 \uC22B\uC790\uC5EC\uC57C \uD569\uB2C8\uB2E4`, 3e3);
        return;
      }
      this.projectId = Uid.next();
      this.projectName = DEFAULT_PROJECT_NAME;
      this.createdAt = Date.now();
      if (this.autoSaver)
        this.autoSaver.setProjectId(this.projectId);
      this.newProjectInternal(w, h);
      this.displayCanvas?.setProjectSize(w, h);
      this.refitCanvas?.();
      this.scheduleRender();
      void this.saveProject();
    }
    async saveProject() {
      if (this.projectName === DEFAULT_PROJECT_NAME) {
        const name = prompt("\uD504\uB85C\uC81D\uD2B8 \uC774\uB984", DEFAULT_PROJECT_NAME);
        if (name !== null && name.trim().length > 0)
          this.projectName = name.trim();
      }
      const state = this.buildState();
      const json = ProjectCodec.encode(state);
      await this.store.putProject({
        id: this.projectId,
        name: this.projectName,
        createdAt: this.createdAt,
        updatedAt: Date.now(),
        width: this.projectWidth,
        height: this.projectHeight,
        projectJson: json
      });
      await this.store.putMeta("lastOpenProjectId", this.projectId);
      void this.projectPanel.render();
    }
    /** 프로젝트와 그 autosave 를 함께 지운다. */
    async deleteProject(id) {
      try {
        await this.store.deleteProject(id);
        if (id === this.projectId) {
          await this.store.putMeta("lastOpenProjectId", void 0);
        }
        await this.projectPanel.render();
        this.flashStatus("\u2713 \uD504\uB85C\uC81D\uD2B8\uB97C \uC0AD\uC81C\uD588\uC2B5\uB2C8\uB2E4", 1800);
      } catch (e) {
        const msg = e instanceof Error ? e.message : String(e);
        this.flashStatus(`\u26A0\uFE0F \uC0AD\uC81C \uC2E4\uD328: ${msg}`, 3e3);
        console.error("deleteProject failed", e);
      }
    }
    /** 저장된 프로젝트의 이름을 바꾼다. 저장본 JSON 안의 meta.name 도 함께 고친다. */
    async renameProject(id, name) {
      try {
        const p = await this.store.getProject(id);
        if (!p)
          return;
        const state = ProjectCodec.decode(p.projectJson);
        state.meta.name = name;
        await this.store.putProject({ ...p, name, updatedAt: Date.now(), projectJson: ProjectCodec.encode(state) });
        if (id === this.projectId)
          this.projectName = name;
        await this.projectPanel.render();
        this.flashStatus(`\u2713 \uC774\uB984\uC744 "${name}" \uB85C \uBC14\uAFE8\uC2B5\uB2C8\uB2E4`, 1800);
      } catch (e) {
        const msg = e instanceof Error ? e.message : String(e);
        this.flashStatus(`\u26A0\uFE0F \uC774\uB984 \uBCC0\uACBD \uC2E4\uD328: ${msg}`, 3e3);
        console.error("renameProject failed", e);
      }
    }
    async loadProject(id) {
      const p = await this.store.getProject(id);
      if (!p)
        return;
      this.applyState(ProjectCodec.decode(p.projectJson));
      void this.projectPanel.render();
    }
    exportPng() {
      const c = document.createElement("canvas");
      c.width = this.projectWidth;
      c.height = this.projectHeight;
      const ctx = c.getContext("2d");
      this.stack.compositeTo(ctx, Rect.create(0, 0, this.projectWidth, this.projectHeight));
      const url = c.toDataURL("image/png");
      const a = document.createElement("a");
      a.href = url;
      a.download = `${this.projectName}.png`;
      a.click();
    }
    exportJson() {
      const blob = new Blob([ProjectCodec.encode(this.buildState())], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${this.projectName}.json`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1e3);
    }
    async importJson(file) {
      try {
        const text = await file.text();
        const state = ProjectCodec.decode(text);
        this.applyState(state);
        void this.projectPanel.render();
        this.flashStatus(`\u2713 JSON \uBD88\uB7EC\uC624\uAE30 \uC644\uB8CC: ${file.name}`, 2e3);
      } catch (e) {
        const msg = e instanceof Error ? e.message : String(e);
        this.flashStatus(`\u26A0\uFE0F JSON \uBD88\uB7EC\uC624\uAE30 \uC2E4\uD328: ${msg}`, 3500);
        console.error("importJson failed", e);
      }
    }
    async importPng(file) {
      try {
        if (!canAddLayer(this.stack.size())) {
          this.flashStatus(`\u26A0\uFE0F  \uCD5C\uB300 ${LAYER_LIMIT}\uAC1C \uB808\uC774\uC5B4\uAE4C\uC9C0 \uB9CC\uB4E4 \uC218 \uC788\uC2B5\uB2C8\uB2E4`, 2500);
          return;
        }
        const layer = await importPngFile(file, this.projectWidth, this.projectHeight, realCanvasFactory, file.name);
        this.history.execute(new AddLayerCommand({ snapshot: historySnapshot(layer), index: this.stack.size() }), { stack: this.stack });
        this.scheduleRender();
        this.flashStatus(`\u2713 PNG \uAC00\uC838\uC624\uAE30: ${file.name}`, 2e3);
      } catch (e) {
        const msg = e instanceof Error ? e.message : String(e);
        this.flashStatus(`\u26A0\uFE0F PNG \uAC00\uC838\uC624\uAE30 \uC2E4\uD328: ${msg}`, 3500);
        console.error("importPng failed", e);
      }
    }
    applyChromaKey() {
      const layer = this.stack.getActive();
      if (!layer)
        return;
      const colorIn = prompt("\uBC30\uACBD\uC0C9 (\uC608: #ffffff)", "#ffffff");
      if (colorIn === null)
        return;
      const key = Color.tryParse(colorIn);
      if (!key) {
        this.flashStatus("\u26A0\uFE0F \uC0C9 \uD615\uC2DD\uC774 \uC62C\uBC14\uB974\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4 (#rgb, #rrggbb, rgba(...))", 3500);
        return;
      }
      const tolStr = prompt("\uD5C8\uC6A9\uC624\uCC28 (0-200)", "20");
      if (tolStr === null)
        return;
      const featherStr = prompt("\uAC00\uC7A5\uC790\uB9AC \uBD80\uB4DC\uB7FD\uAC8C (0-100)", "10");
      if (featherStr === null)
        return;
      const clampNum = (v, fallback, min, max) => {
        const n = Number(v.trim());
        if (!Number.isFinite(n))
          return fallback;
        return Math.max(min, Math.min(max, Math.floor(n)));
      };
      const tol = clampNum(tolStr, 20, 0, 200);
      const feather = clampNum(featherStr, 10, 0, 100);
      const before = layer.getPixels(0, 0, layer.width, layer.height);
      const out = removeBackground(before, key, tol, feather);
      layer.putPixels(out, 0, 0);
      const after = layer.getPixels(0, 0, layer.width, layer.height);
      this.history.execute(new PixelEditCommand({
        layerId: layer.id,
        rect: Rect.create(0, 0, layer.width, layer.height),
        before: { width: before.width, height: before.height, data: new Uint8ClampedArray(before.data) },
        after: { width: after.width, height: after.height, data: new Uint8ClampedArray(after.data) },
        label: "Remove background"
      }), { stack: this.stack });
    }
  };

  // dist/src/app/main.js
  window.addEventListener("DOMContentLoaded", () => {
    const root = document.getElementById("app");
    if (!root)
      return;
    const app = new PainterApp();
    app.boot(root).catch((e) => console.error("Painter boot failed", e));
  });
})();

    </script>
  </body>
